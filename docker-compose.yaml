services:
  backend:
    build: 
      context: .
      dockerfile: local.Dockerfile
    container_name: microhris
    working_dir: /app
    volumes:
      - .:/app
      - /app/vendor
    ports:
      - 8007:8000
    depends_on:
      - db
  db:
    image: mysql:latest
    container_name: microhris-db
    ports:
      - 33018:3306
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=micro_hris